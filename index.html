<title>Khai báo tài khoản MXH - VKSND Khu vực 9</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23b7950b'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white'%3E%E2%9A%96%3C/text%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #8b0000 0%, #c0392b 60%, #922b21 100%);
  }
  /* Màn hình chờ hiển thị trong lúc iframe (ứng dụng Apps Script) đang tải,
     tránh khoảng trắng/xanh lạc tông trước khi ứng dụng thật hiện ra. */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #ffffff;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    text-align: center;
    padding: 20px;
    transition: opacity .25s ease;
  }
  #loadingScreen.hide {
    opacity: 0;
    pointer-events: none;
  }
  .loading-emblem {
    width: 72px;
    height: auto;
  }
  .loading-emblem img {
    display: block;
    width: 100%;
    height: auto;
  }
  .loading-title {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    max-width: 320px;
    line-height: 1.4;
  }
  .loading-spinner {
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255,255,255,.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    position: relative;
    z-index: 1;
  }
  .loading-note {
    font-size: 12.5px;
    color: rgba(255,255,255,.85);
    max-width: 300px;
    line-height: 1.5;
    margin-top: 2px;
    display: none;
  }
  .loading-note.show { display: block; }
  .loading-actions {
    display: none;
    flex-direction: column;
    gap: 10px;
    margin-top: 6px;
    width: 100%;
    max-width: 280px;
  }
  .loading-actions.show { display: flex; }
  .loading-btn {
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    touch-action: manipulation;
  }
  .loading-btn-primary { background: #b7950b; color: #ffffff; }
  .loading-btn-secondary { background: rgba(255,255,255,.14); color: #ffffff; border: 1.5px solid rgba(255,255,255,.5); }
</style>
</head>

      // Đợi thêm ~1.2s cho lớp nội dung thật bên trong kịp hiện ra rồi mới ẩn màn hình chờ,
      // tránh trường hợp ẩn quá sớm khiến người dùng thấy khoảng trống/màu nền trong lúc chờ.
      setTimeout(_anManHinhCho, 1200);
    }
    function _thuTaiLai() {
      daAn = false;
      document.getElementById('loadingActions').classList.remove('show');
      document.getElementById('loadingNote').classList.remove('show');
      document.getElementById('loadingSpinner').style.display = '';
      document.getElementById('loadingScreen').classList.remove('hide');
      _datLaiHenGio();
      document.getElementById('appFrame').src = APP_URL;
    }
    function _datLaiHenGio() {
      clearTimeout(henGioNote); clearTimeout(henGioAutoRetry); clearTimeout(henGioFallback);
      henGioNote = setTimeout(function(){ if(!daAn) document.getElementById('loadingNote').classList.add('show'); }, 4000);
      henGioAutoRetry = setTimeout(function(){
        if (daAn || daTuTaiLai) return;
        daTuTaiLai = true;
        document.getElementById('appFrame').src = APP_URL; // tự thử tải lại 1 lần, âm thầm
      }, 7000);
      henGioFallback = setTimeout(function(){
        if (daAn) return;
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('loadingNote').classList.add('show');
        document.getElementById('loadingNote').textContent = 'Tải hơi lâu hơn bình thường — có thể do mạng chậm hoặc ứng dụng đang khởi động lại.';
        document.getElementById('loadingActions').classList.add('show');
      }, 15000);
    }
    _datLaiHenGio();
  </script>
</body>
</html>
